<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="TrueSight DAO sprint board — a read-only view of active handoffs and what needs a human." />
<title>TrueSight DAO — Sprint Board</title>
<!-- Favicon: same asset dapp/index.html uses -->
<link rel="icon" type="image/png" href="https://github.com/TrueSightDAO/.github/blob/main/assets/20240612_truesight_dao_logo_square.png?raw=true" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="https://github.com/TrueSightDAO/.github/blob/main/assets/20240612_truesight_dao_logo_square.png?raw=true" alt="TrueSight DAO" />
    <h1>TrueSight DAO · Sprint Board</h1>
  </div>
  <nav class="viewswitch" role="tablist" aria-label="View">
    <button id="tab-needs" class="tab active" role="tab" aria-selected="true">Needs You</button>
    <button id="tab-board" class="tab" role="tab" aria-selected="false">Full Board</button>
  </nav>
</header>

<main>
  <p id="meta" class="meta">Loading…</p>
  <div id="allclear" class="allclear" hidden>
    <div class="check">✓</div>
    <h2>Nothing is blocked on you</h2>
    <p>No tickets are <code>blocked_on_human</code> or <code>human_uat_ready</code> — everything is moving.</p>
  </div>
  <section id="needs" class="view"></section>
  <section id="board" class="board view" hidden></section>
  <footer id="done" class="donefoot"></footer>
</main>

<dialog id="spec">
  <div class="specbar">
    <span id="spec-title">Spec</span>
    <div class="bar-actions">
      <button id="copy-link" class="copy" type="button"
              aria-label="Copy a link to this spec" title="Copy a link to this spec">
        <span class="ico" aria-hidden="true">&#x29C9;</span><span class="lbl">Copy URL</span>
      </button>
      <form method="dialog"><button class="x" aria-label="Close">&#x2715;</button></form>
    </div>
  </div>
  <pre id="spec-body">Loading&#x2026;</pre>
</dialog>

<script src="app.js"></script>
</body>
</html>
